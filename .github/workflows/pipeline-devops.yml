name: DevSecOps CI Pipeline Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}

jobs:
  # (1) code check quality gate (pylint) 
  pylint-check:
    name: Pylint Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pylint
        run: pip install pylint

      - name: Run Pylint with minimum score 9
        run: pylint **/*.py --fail-under=9

  # (2) dependency security gate (pip-audit)
  dependency-audit:
    name: Pip-Audit Dependency Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pip-Audit
        run: pip install pip-audit

      - name: Run Dependency Vulnerability Scan
        run: pip-audit -r requirements.txt